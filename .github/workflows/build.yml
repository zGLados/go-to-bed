name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test & build GotoBed.exe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); from version import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "src/version.py says $version but tag is ${{ github.ref_name }}"
            exit 1
          }

      - name: Run tests
        run: python -m pytest -v

      - name: Self-test from source
        env:
          GOTOBED_DATA_DIR: ${{ runner.temp }}\gotobed-src
        run: python src/main.py --self-test

      - name: Build executable
        run: python build.py

      - name: Self-test executable
        shell: pwsh
        env:
          GOTOBED_DATA_DIR: ${{ runner.temp }}\gotobed-exe
        run: |
          $p = Start-Process -FilePath dist\GotoBed.exe -ArgumentList '--self-test' -Wait -PassThru
          Get-Content "$env:GOTOBED_DATA_DIR\gotobed.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed with exit code $($p.ExitCode)"; exit 1 }

      - name: End-to-end update test
        shell: pwsh
        run: |
          # Build a fake "old" version 0.0.1 and let it update itself to the exe built above
          (Get-Content src/version.py) -replace "__version__ = '.*'", "__version__ = '0.0.1'" | Set-Content src/version.py
          python build.py --dist dist-old
          git checkout -- src/version.py
          python tools/e2e_update.py dist-old\GotoBed.exe dist\GotoBed.exe

      - name: End-to-end install / uninstall test
        run: python tools/e2e_install.py dist\GotoBed.exe

      - name: End-to-end migration test (running 3.0.0 -> this version)
        run: |
          git fetch --depth 1 origin tag v3.0.0
          git worktree add legacy v3.0.0
          python legacy\build.py
          python tools/e2e_migrate.py legacy\dist\GotoBed.exe dist\GotoBed.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: GotoBed-windows
          path: dist/GotoBed.exe
          if-no-files-found: error

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # docs/release-notes/<tag>.md (if present) goes on top of the generated notes
          $notes = "docs/release-notes/${{ github.ref_name }}.md"
          if (Test-Path $notes) { Copy-Item $notes release-notes.md } else { Set-Content release-notes.md '' }

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/GotoBed.exe
          body_path: release-notes.md
          generate_release_notes: true
